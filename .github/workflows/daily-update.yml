name: daily-data-update

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京时间每天 09:00（注意：cron 固定 UTC，无本地时区）
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

# 注意：所有巡检步骤必须在同一个 job 内顺序执行。
# 2026-09-24 ~ 09-30 曾拆成 4 个并行 job，但每个 job 独立 checkout、没有 artifact 传递，
# publish 再 checkout 一次拿不到前序产物 → signals/sourcehealth/alerts/snapshot 连续 7 天停更。
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      has_failure: ${{ steps.outcomes.outputs.has_failure }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ① 重新生成 models.dev 兜底快照
        id: snapshot
        run: |
          if node scripts/update-snapshot.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: ② 官方页面变动检测（哈希）
        id: pages
        continue-on-error: true
        run: |
          if node scripts/check-pages.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: ③ 抓取 changelog / 状态页 / 社区订阅源
        id: feeds
        run: |
          if node scripts/fetch-feeds.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API 未认证仅 60 次/小时

      - name: ④ 价格库与免费模型差异检测
        id: prices
        continue-on-error: true
        run: |
          if node scripts/diff-prices.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: ⑤ 白嫖额度来源页核对 + 促销自动过期归档
        id: listings
        continue-on-error: true
        run: |
          if node scripts/verify-listings.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: ⑥ 记录订阅计划价格历史快照 + 写入巡检日期
        id: history
        continue-on-error: true
        run: |
          # 旧写法把成败写成 `ok=false: record-history` 挂在一个没有 id 的步骤上，
          # 既拿不到 outcome，也不会进下面的失败汇总——record-history 崩掉时
          # 巡检会安静地少掉当天价格历史，而且流程仍然是绿的。
          if node scripts/record-history.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          # 与各脚本保持一致：先写 .tmp 再 mv，避免中途被杀留下半截 JSON（读取容错会当成「文件不存在」）
          echo "{\"autoCheck\":\"$(date -u +%Y-%m-%d)\"}" > data/auto/meta.json.tmp
          mv data/auto/meta.json.tmp data/auto/meta.json

      - name: 校验数据与脚本（坏数据不进仓库）
        id: validate
        continue-on-error: true
        run: |
          if node scripts/validate.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: outcome 汇总
        id: outcomes
        run: |
          fails=""
          [ "${{ steps.snapshot.outputs.ok }}" = "true" ] || fails="$fails snapshot"
          [ "${{ steps.pages.outputs.ok }}" = "true" ] || fails="$fails pages"
          [ "${{ steps.feeds.outputs.ok }}" = "true" ] || fails="$fails feeds"
          [ "${{ steps.prices.outputs.ok }}" = "true" ] || fails="$fails prices"
          [ "${{ steps.listings.outputs.ok }}" = "true" ] || fails="$fails listings"
          [ "${{ steps.history.outputs.ok }}" = "true" ] || fails="$fails history"
          [ "${{ steps.validate.outputs.ok }}" = "true" ] || fails="$fails validate"
          if [ -n "$fails" ]; then
            echo "has_failure=true" >> "$GITHUB_OUTPUT"
            echo "failed_steps=$fails" >> "$GITHUB_OUTPUT"
            echo "失败步骤：$fails"
          else
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成待处理清单
        run: |
          node -e '
            const fs = require("fs");
            const read = (p, d) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch (e) { return d; } };
            const today = new Date().toISOString().slice(0, 10);
            const out = [];

            // 官方页变动 → 待人工核价
            const alerts = read("data/auto/alerts.json", []).filter(a => !a.resolved && a.detected === today);
            if (alerts.length) {
              out.push("### 官方页内容变动，价格待人工核实\n" +
                alerts.map(a => `- [${a.label}](${a.url}) 检测于 ${a.detected}`).join("\n"));
            }

            // 机器线索中的官方来源信号 → 待确认后录入 promos.json
            const reportedPath = "data/auto/reported.json";
            const reported = read(reportedPath, { ids: [] });
            const reportedSet = new Set(reported.ids || []);
            const sig = read("data/auto/signals.json", { items: [] }).items.filter(
              s => s.tier !== "community" && s.kind !== "availability" && !reportedSet.has(s.id)
            );
            if (sig.length) {
              out.push("### 自动发现的新线索（官方源，需人工确认后才进价格表）\n" +
                sig.slice(0, 20).map(s => `- [${s.title}](${s.url})　— ${s.sourceLabel}`).join("\n"));
              reported.ids = [...reportedSet, ...sig.map(s => s.id)];
              reported.updatedAt = today;
              fs.writeFileSync(reportedPath, JSON.stringify(reported, null, 1) + "\n", "utf8");
            }

            // 白嫖额度条目异常 → 待人工复核
            const fb = read("data/manual/freebies.json", { items: [] });
            const fbIssues = (fb.items || []).filter(f => f.status === "stale" || f.status === "changed" || f.status === "warn");
            if (fbIssues.length) {
              out.push("### 🎁 白嫖/免费额度条目需要人工复核\n" +
                fbIssues.map(f => `- **${f.name}**（${f.status}）${f.source} — ${f.statusNote || f.lastError || ""}`).join("\n"));
            }

            // 促销今日到期 → 已自动标「已结束」，提醒确认时间线上是否需要补一条后续动态
            const pm = read("data/manual/promos.json", { items: [] });
            const justExpired = (pm.items || []).filter(p => p.expired && p.expiredOn === today);
            if (justExpired.length) {
              out.push("### ⏰ 促销活动今日到期（已自动标记为「已结束」）\n" +
                justExpired.map(p => `- ${p.title}（截止 ${p.expires}）`).join("\n"));
            }

            // 连续失败的源 → 需要修监控
            const hs = read("data/auto/sourcehealth.json", { sources: {} }).sources || {};
            const dead = Object.values(hs).filter(s => s.ok === false && (s.consecutiveFailures || 0) >= 3);
            if (dead.length) {
              out.push("### ⚠ 以下信息源已连续 3 天抓取失败，需要在 data/manual/sources.json 中修复或停用\n" +
                dead.map(s => `- ${s.label}（${s.url}）— 最后错误：${s.error || "未知"}`).join("\n"));
            }

            // 标注 auto-revert 条目
            const transients = read("data/auto/transients.json", { items: [] });
            const todayReverts = transients.items.filter(t => t.resolvedAt === today);
            if (todayReverts.length) {
              out.push("### 🔄 今日 auto-revert 记录（内容回到基线，可能为临时促销/渲染变体）\n" +
                todayReverts.map(t => `- ${t.label}（${t.url}）：${t.detected} 检测到变动，今日自动恢复`).join("\n"));
            }

            fs.writeFileSync("issue-body.md", out.length ? out.join("\n\n") : "", "utf8");
          '

      - name: 提交并推送（触发 Pages 重新发布）
        id: commit
        # 校验没过就不提交：宁可当天没有数据更新，也不要把坏数据推上线上
        if: steps.validate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "chore(daily): 自动数据巡检 $(date -u +%Y-%m-%d)"
          fi
          # 推送前变基到远端最新：巡检运行期间若有人工提交合入 main，避免 fetch first 拒绝
          git pull --rebase origin main
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无数据变化，跳过提交"
          fi

      - name: 有待处理事项时开 issue
        if: steps.commit.outputs.changed == 'true' || steps.outcomes.outputs.has_failure == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s issue-body.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "每日巡检待处理 $(date -u +%F)" \
              --body-file issue-body.md
          elif [ "${{ steps.outcomes.outputs.has_failure }}" = "true" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "每日巡检部分任务失败 $(date -u +%F)" \
              --body "部分巡检任务失败，请查看 Actions 日志排查。失败步骤：${{ steps.outcomes.outputs.failed_steps }}"
          else
            echo "无待人工处理事项（仅有常规数据提交）"
          fi
