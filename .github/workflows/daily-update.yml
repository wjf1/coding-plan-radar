name: daily-data-update

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京时间每天 09:00（注意：cron 固定 UTC，无本地时区）
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 每个抓取任务互相独立：任一源失败不影响其余任务，也不中断整个巡检。
      # 源的成功/失败会写入 data/sourcehealth.json，在站点「信息源健康」里公开可见。

      - name: ① 重新生成 models.dev 兜底快照
        continue-on-error: true
        run: node scripts/update-snapshot.mjs

      - name: ② 官方页面变动检测（哈希）
        continue-on-error: true
        run: node scripts/check-pages.mjs

      - name: ③ 抓取 changelog / 状态页 / 社区订阅源
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API 未认证仅 60 次/小时
        run: node scripts/fetch-feeds.mjs

      - name: ④ 价格库与免费模型差异检测
        continue-on-error: true
        run: node scripts/diff-prices.mjs

      - name: 写入巡检日期
        run: |
          echo "{\"autoCheck\":\"$(date -u +%Y-%m-%d)\"}" > data/meta.json

      - name: 提交并推送（触发 Pages 重新发布）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(daily): 自动数据巡检 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 有变动 / 有源失效时开 issue 提醒人工处理
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs = require("fs");
            const read = (p, d) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch (e) { return d; } };
            const today = new Date().toISOString().slice(0, 10);
            const out = [];

            // 官方页变动 → 待人工核价
            const alerts = read("data/alerts.json", []).filter(a => !a.resolved && a.detected === today);
            if (alerts.length) {
              out.push("### 官方页内容变动，价格待人工核实\n" +
                alerts.map(a => `- [${a.label}](${a.url}) 检测于 ${a.detected}`).join("\n"));
            }

            // 机器线索中的官方来源信号 → 待确认后录入 promos.json
            // 只报「促销 / 价格 / 停售」类：状态页故障事件（kind=availability）不算需要人工处理的线索，
            // 否则 Claude/GitHub 状态页一忙就会天天开 issue。它们仍会显示在站点「线索队列」里。
            const sig = read("data/signals.json", { items: [] }).items
              .filter(s => s.tier !== "community" && s.kind !== "availability" && s.firstSeen === today);
            if (sig.length) {
              out.push("### 自动发现的新线索（官方源，需人工确认后才进价格表）\n" +
                sig.slice(0, 20).map(s => `- [${s.title}](${s.url})　— ${s.sourceLabel}`).join("\n"));
            }

            // 连续失败的源 → 需要修监控
            const hs = read("data/sourcehealth.json", { sources: {} }).sources || {};
            const dead = Object.values(hs).filter(s => s.ok === false && (s.consecutiveFailures || 0) >= 3);
            if (dead.length) {
              out.push("### ⚠ 以下信息源已连续 3 天抓取失败，需要在 data/sources.json 中修复或停用\n" +
                dead.map(s => `- ${s.label}（${s.url}）— 最后错误：${s.error || "未知"}`).join("\n"));
            }
            if (out.length) fs.writeFileSync("issue-body.md", out.join("\n\n"), "utf8");
            else fs.writeFileSync("issue-body.md", "", "utf8");
          '
          if [ -s issue-body.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "每日巡检待处理 $(date -u +%F)" \
              --body-file issue-body.md
          else
            echo "无待人工处理事项（仅有常规数据提交）"
          fi
