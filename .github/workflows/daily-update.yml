name: daily-data-update

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京时间每天 09:00（注意：cron 固定 UTC，无本地时区）
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ① 重新生成 models.dev 兜底快照
        id: run
        run: |
          node scripts/update-snapshot.mjs && echo "result=success" >> "$GITHUB_OUTPUT" || echo "result=failure" >> "$GITHUB_OUTPUT"

  check-pages:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ② 官方页面变动检测（哈希）
        id: run
        continue-on-error: true
        run: |
          node scripts/check-pages.mjs && echo "result=success" >> "$GITHUB_OUTPUT" || echo "result=failure" >> "$GITHUB_OUTPUT"

  fetch-feeds:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ③ 抓取 changelog / 状态页 / 社区订阅源
        id: run
        run: |
          node scripts/fetch-feeds.mjs && echo "result=success" >> "$GITHUB_OUTPUT" || echo "result=failure" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API 未认证仅 60 次/小时

  diff-prices:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ④ 价格库与免费模型差异检测
        id: run
        continue-on-error: true
        run: |
          node scripts/diff-prices.mjs && echo "result=success" >> "$GITHUB_OUTPUT" || echo "result=failure" >> "$GITHUB_OUTPUT"

  publish:
    needs: [update-snapshot, check-pages, fetch-feeds, diff-prices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: outcome 汇总
        id: outcomes
        run: |
          echo "snapshot=${{ needs.update-snapshot.result }}" >> "$GITHUB_OUTPUT"
          echo "pages=${{ needs.check-pages.result }}" >> "$GITHUB_OUTPUT"
          echo "feeds=${{ needs.fetch-feeds.result }}" >> "$GITHUB_OUTPUT"
          echo "prices=${{ needs.diff-prices.result }}" >> "$GITHUB_OUTPUT"
          has_failure="false"
          if [ "${{ needs.update-snapshot.result }}" = "failure" ] || [ "${{ needs.check-pages.result }}" = "failure" ] || [ "${{ needs.fetch-feeds.result }}" = "failure" ] || [ "${{ needs.diff-prices.result }}" = "failure" ]; then
            has_failure="true"
          fi
          echo "has_failure=$has_failure" >> "$GITHUB_OUTPUT"

      - name: 写入巡检日期
        run: |
          echo "{\"autoCheck\":\"$(date -u +%Y-%m-%d)\"}" > data/meta.json

      - name: ⑤ 记录订阅计划价格历史快照
        run: |
          node scripts/record-history.mjs

      - name: 生成待处理清单
        run: |
          node -e '
            const fs = require("fs");
            const read = (p, d) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch (e) { return d; } };
            const today = new Date().toISOString().slice(0, 10);
            const out = [];

            // 官方页变动 → 待人工核价
            const alerts = read("data/alerts.json", []).filter(a => !a.resolved && a.detected === today);
            if (alerts.length) {
              out.push("### 官方页内容变动，价格待人工核实\n" +
                alerts.map(a => `- [${a.label}](${a.url}) 检测于 ${a.detected}`).join("\n"));
            }

            // 机器线索中的官方来源信号 → 待确认后录入 promos.json
            const reportedPath = "data/reported.json";
            const reported = read(reportedPath, { ids: [] });
            const reportedSet = new Set(reported.ids || []);
            const sig = read("data/signals.json", { items: [] }).items.filter(
              s => s.tier !== "community" && s.kind !== "availability" && !reportedSet.has(s.id)
            );
            if (sig.length) {
              out.push("### 自动发现的新线索（官方源，需人工确认后才进价格表）\n" +
                sig.slice(0, 20).map(s => `- [${s.title}](${s.url})　— ${s.sourceLabel}`).join("\n"));
              reported.ids = [...reportedSet, ...sig.map(s => s.id)];
              reported.updatedAt = today;
              fs.writeFileSync(reportedPath, JSON.stringify(reported, null, 1) + "\n", "utf8");
            }

            // 连续失败的源 → 需要修监控
            const hs = read("data/sourcehealth.json", { sources: {} }).sources || {};
            const dead = Object.values(hs).filter(s => s.ok === false && (s.consecutiveFailures || 0) >= 3);
            if (dead.length) {
              out.push("### ⚠ 以下信息源已连续 3 天抓取失败，需要在 data/sources.json 中修复或停用\n" +
                dead.map(s => `- ${s.label}（${s.url}）— 最后错误：${s.error || "未知"}`).join("\n"));
            }

            // 标注 auto-revert 条目
            const transients = read("data/transients.json", { items: [] });
            const todayReverts = transients.items.filter(t => t.resolvedAt === today);
            if (todayReverts.length) {
              out.push("### 🔄 今日 auto-revert 记录（内容回到基线，可能为临时促销/渲染变体）\n" +
                todayReverts.map(t => `- ${t.label}（${t.url}）：${t.detected} 检测到变动，今日自动恢复`).join("\n"));
            }

            fs.writeFileSync("issue-body.md", out.length ? out.join("\n\n") : "", "utf8");
          '

      - name: 提交并推送（触发 Pages 重新发布）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(daily): 自动数据巡检 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 有待处理事项时开 issue
        if: steps.commit.outputs.changed == 'true' || steps.outcomes.outputs.has_failure == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s issue-body.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "每日巡检待处理 $(date -u +%F)" \
              --body-file issue-body.md
          elif [ "${{ steps.outcomes.outputs.has_failure }}" = "true" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "每日巡检部分任务失败 $(date -u +%F)" \
              --body "部分巡检任务失败，请查看 Actions 日志排查。\n\n- update-snapshot: ${{ steps.outcomes.outputs.snapshot }}\n- check-pages: ${{ steps.outcomes.outputs.pages }}\n- fetch-feeds: ${{ steps.outcomes.outputs.feeds }}\n- diff-prices: ${{ steps.outcomes.outputs.prices }}"
          else
            echo "无待人工处理事项（仅有常规数据提交）"
          fi
