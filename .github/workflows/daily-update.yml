name: daily-data-update

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京时间每天 09:00（注意：cron 固定 UTC，无本地时区）
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 数据契约与纯函数层先过闸：字段坏了就别再往下跑，否则新鲜度面板会拿脏值渲染，
      # 而且后面所有比对都建立在错误基线上。这一步不带 continue-on-error —— 它失败就是硬失败。
      - name: ⓪ 数据契约校验 + 单元测试
        run: |
          node scripts/validate-data.mjs
          node --test

      # 每个抓取任务互相独立：任一源失败不影响其余任务，也不中断整个巡检。
      # 源的成功/失败会写入 data/sourcehealth.json，在站点「信息源健康」里公开可见。
      # continue-on-error 只用于隔离「单个源抓不到」这类数据问题；脚本自身崩溃是代码 bug，
      # 由下面的 outcome 汇总负责，见 mark-pipeline.mjs。

      - name: ① 重新生成 models.dev 兜底快照
        id: s_snapshot
        continue-on-error: true
        run: node scripts/update-snapshot.mjs

      - name: ② 官方页面变动检测（哈希）
        id: s_pages
        continue-on-error: true
        run: node scripts/check-pages.mjs

      - name: ③ 抓取 changelog / 状态页 / 社区订阅源
        id: s_feeds
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API 未认证仅 60 次/小时
        run: node scripts/fetch-feeds.mjs

      - name: ④ 价格库与免费模型差异检测
        id: s_diff
        continue-on-error: true
        run: node scripts/diff-prices.mjs

      # 巡检日期的唯一写入点：有脚本崩溃时保持旧日期并写 pipelineDegraded，绝不推进。
      # 逐项列举而非 steps.*.outcome 通配 —— Actions 不支持星号展开，写出来会得到字面量，
      # 降级判定静默失效且不报错，所以宁可啰嗦。
      - name: 写入巡检日期
        id: meta
        run: |
          CRASHED=""
          [ "${{ steps.s_snapshot.outcome }}" = "failure" ] && CRASHED="$CRASHED,s_snapshot"
          [ "${{ steps.s_pages.outcome }}" = "failure" ] && CRASHED="$CRASHED,s_pages"
          [ "${{ steps.s_feeds.outcome }}" = "failure" ] && CRASHED="$CRASHED,s_feeds"
          [ "${{ steps.s_diff.outcome }}" = "failure" ] && CRASHED="$CRASHED,s_diff"
          CRASHED="${CRASHED#,}"
          node scripts/mark-pipeline.mjs --crashed="$CRASHED"
          echo "crashed=$CRASHED" >> "$GITHUB_OUTPUT"

      # 先生成待处理清单（会写入 data/reported.json 记录"已上报"的线索），
      # 再提交，最后才维护 issue —— 顺序不能颠倒，否则 reported.json 不会被持久化，
      # 同一条线索就会天天重复上报。逻辑与用例见 scripts/build-triage.mjs。
      - name: 生成待人工处理清单
        run: node scripts/build-triage.mjs

      - name: 提交并推送（触发 Pages 重新发布）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(daily): 自动数据巡检 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 待办收敛为一条常驻 issue（label: daily-triage），而不是每天开一条新的：
      # 有未决事项就覆盖正文，清空了就把这条关掉。不再受「今天有没有 git 变化」影响——
      # 队列反映的是现实，不是提交记录。
      - name: 维护常驻待办 issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-triage --repo "$GITHUB_REPOSITORY" \
            --color f5b445 --description 自动巡检产生的待人工处理队列 --force >/dev/null 2>&1 || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label daily-triage --state open \
            --json number --jq '.[0].number // empty')
          if [ -s issue-body.md ]; then
            printf '%s\n\n<sub>本 issue 由每日自动巡检维护，正文请勿手工编辑；清单为空时会自动关闭。</sub>\n' \
              "$(cat issue-body.md)" > issue-body.md
            if [ -n "$OPEN" ]; then
              gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
              echo "已更新常驻 issue #$OPEN"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "巡检待处理队列" --label daily-triage --body-file issue-body.md
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "自动巡检：当前无未决事项。"
            echo "队列已清空，关闭 #$OPEN"
          else
            echo "无未决事项，无需维护 issue"
          fi

      # 必须放在最后一步：提交与 issue 都要先完成，降级状态得先被持久化下来，
      # 否则 job 红是红了，仓库里却看不出哪一天没跑成，第二天又「看起来正常」。
      - name: 有脚本崩溃时以失败收尾
        if: steps.meta.outputs.crashed != ''
        run: |
          echo "::error::以下巡检脚本崩溃，data/meta.json 已标记 pipelineDegraded：${{ steps.meta.outputs.crashed }}"
          exit 1
