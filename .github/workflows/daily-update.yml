name: daily-data-update

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 北京时间每天 09:00（注意：cron 固定 UTC，无本地时区）
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

# 注意：所有巡检步骤必须在同一个 job 内顺序执行。
# 2026-09-24 ~ 09-30 曾拆成 4 个并行 job，但每个 job 独立 checkout、没有 artifact 传递，
# publish 再 checkout 一次拿不到前序产物 → signals/sourcehealth/alerts/snapshot 连续 7 天停更。
jobs:
  update:
    runs-on: ubuntu-latest
    # 硬超时兜底：抓取脚本已各自带 25s 请求超时，这里防的是流程级挂起（如 apt/网络层卡死）
    # 吞掉 360 分钟默认墙钟——失败汇总与 issue 告警机制依赖本 job 正常走到失败分支
    timeout-minutes: 30
    outputs:
      has_failure: ${{ steps.outcomes.outputs.has_failure }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # 数据契约与逻辑层先过闸：坏数据或坏代码就别再往下跑，否则新鲜度面板会拿脏值渲染。
      # 本步骤不带 continue-on-error：失败即红即停（与后面的巡检步骤失败语义不同——那是数据问题）
      - name: ⓪ 数据契约校验 + 单元测试
        run: |
          node scripts/validate.mjs
          node --test

      - name: ① 重新生成 models.dev 兜底快照
        id: snapshot
        run: |
          if node scripts/update-snapshot.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: ② 官方页面变动检测（哈希）
        id: pages
        continue-on-error: true
        run: |
          if node scripts/check-pages.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: ③ 抓取 changelog / 状态页 / 社区订阅源
        id: feeds
        run: |
          if node scripts/fetch-feeds.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GITHUB_TOKEN: ${{ github.token }}   # GitHub API 未认证仅 60 次/小时

      - name: ④ 价格库与免费模型差异检测
        id: prices
        continue-on-error: true
        run: |
          if node scripts/diff-prices.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: ⑤ 白嫖额度来源页核对 + 促销自动过期归档
        id: listings
        continue-on-error: true
        run: |
          if node scripts/verify-listings.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: ⑥ 记录订阅计划价格历史快照
        id: history
        continue-on-error: true
        run: |
          # 旧写法把成败写成 `ok=false: record-history` 挂在一个没有 id 的步骤上，
          # 既拿不到 outcome，也不会进下面的失败汇总——record-history 崩掉时
          # 巡检会安静地少掉当天价格历史，而且流程仍然是绿的。
          # 巡检日期不再在此处写入：本步骤失败时绝不能把 autoCheck 推进成当天（见下方 meta 步骤）
          if node scripts/record-history.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: 校验数据与脚本（坏数据不进仓库）
        id: validate
        continue-on-error: true
        run: |
          if node scripts/validate.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: 生成 RSS 订阅源（rss.xml）
        id: rss
        continue-on-error: true
        run: |
          # 从站内变更记录生成 rss.xml（对外订阅产物）；与各巡检步骤一致：失败记入汇总并开 issue，不静默
          if node scripts/gen-rss.mjs; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: outcome 汇总
        id: outcomes
        run: |
          fails=""
          [ "${{ steps.snapshot.outputs.ok }}" = "true" ] || fails="$fails snapshot"
          [ "${{ steps.pages.outputs.ok }}" = "true" ] || fails="$fails pages"
          [ "${{ steps.feeds.outputs.ok }}" = "true" ] || fails="$fails feeds"
          [ "${{ steps.prices.outputs.ok }}" = "true" ] || fails="$fails prices"
          [ "${{ steps.listings.outputs.ok }}" = "true" ] || fails="$fails listings"
          [ "${{ steps.history.outputs.ok }}" = "true" ] || fails="$fails history"
          [ "${{ steps.validate.outputs.ok }}" = "true" ] || fails="$fails validate"
          [ "${{ steps.rss.outputs.ok }}" = "true" ] || fails="$fails rss"
          if [ -n "$fails" ]; then
            echo "has_failure=true" >> "$GITHUB_OUTPUT"
            echo "failed_steps=$fails" >> "$GITHUB_OUTPUT"
            echo "失败步骤：$fails"
          else
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
          fi

      # 有任何巡检脚本崩溃（ok=false）时如实降级：autoCheck 保持旧值、写 pipelineDegraded
      # 与失败步骤清单——绝不把失败的运行算成「今天巡检成功」。源抓不到不算崩溃：
      # 那类失败由脚本内部写入 sourcehealth.json，exit 0，不会出现在 $fails 里。
      - name: 写入巡检日期（有脚本崩溃则如实降级，不假装巡检成功）
        id: meta
        run: |
          CRASHED="${{ steps.outcomes.outputs.failed_steps }}"
          CRASHED="${CRASHED# }"
          node scripts/mark-pipeline.mjs --crashed="$CRASHED"
          echo "crashed=$CRASHED" >> "$GITHUB_OUTPUT"

      - name: 生成待处理清单
        # 独立脚本（此前内嵌 ~70 行 node -e，无法单测且外部网页文本未转义即拼 markdown）
        run: node scripts/pending-digest.mjs

      - name: 提交并推送（触发 Pages 重新发布）
        id: commit
        # 校验没过就不提交：宁可当天没有数据更新，也不要把坏数据推上线上
        if: steps.validate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "chore(daily): 自动数据巡检 $(date -u +%Y-%m-%d)"
          fi
          # 推送前变基到远端最新：巡检运行期间若有人工提交合入 main，避免 fetch first 拒绝
          git pull --rebase origin main
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无数据变化，跳过提交"
          fi

      # 待办收敛为一条常驻 issue（label: daily-triage），而不是每天开一条新的：
      # 有未决事项就覆盖正文（未决告警不再隔天消失），清空了就把这条关掉。
      # 不再受「今天有没有 git 变化」影响——队列反映的是现实，不是提交记录。
      - name: 维护常驻待办 issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-triage --repo "$GITHUB_REPOSITORY" \
            --color f5b445 --description 自动巡检产生的待人工处理队列 --force >/dev/null 2>&1 || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label daily-triage --state open \
            --json number --jq '.[0].number // empty')
          if [ "${{ steps.outcomes.outputs.has_failure }}" = "true" ]; then
            printf '\n### ⚠ 本日巡检有脚本崩溃\n\n失败步骤：%s\n\n巡检日期未推进（pipelineDegraded 已写入 meta.json），Actions 运行已标红，请查日志修复后重跑。\n' \
              "${{ steps.outcomes.outputs.failed_steps }}" >> issue-body.md
          fi
          if [ -s issue-body.md ]; then
            printf '%s\n\n<sub>本 issue 由每日自动巡检维护，正文请勿手工编辑；清单为空时会自动关闭。</sub>\n' \
              "$(cat issue-body.md)" > issue-body.md
            if [ -n "$OPEN" ]; then
              gh issue edit "$OPEN" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
              echo "已更新常驻 issue #$OPEN"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "巡检待处理队列" --label daily-triage --body-file issue-body.md
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "自动巡检：当前无未决事项。"
            echo "队列已清空，关闭 #$OPEN"
          else
            echo "无未决事项，无需维护 issue"
          fi

      # 必须放在最后一步：提交与 issue 都要先完成，降级状态得先被持久化下来，
      # 否则 job 红是红了，仓库里却看不出哪一天没跑成，第二天又「看起来正常」。
      - name: 有脚本崩溃时以失败收尾
        if: steps.meta.outputs.crashed != ''
        run: |
          echo "::error::以下巡检脚本崩溃，data/auto/meta.json 已标记 pipelineDegraded：${{ steps.meta.outputs.crashed }}"
          exit 1
